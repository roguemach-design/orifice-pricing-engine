services:
  - type: web
    name: oplates-owner-acceptance-ui
    runtime: docker
    branch: work/drawing-intake-phase1h-owner-acceptance
    region: ohio
    plan: 0.5c-512mb
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    numInstances: 1
    envVars:
      - key: API_BASE
        fromService:
          name: oplates-owner-acceptance-api
          type: pserv
          property: hostport
      - key: API_KEY
        fromService:
          name: oplates-owner-acceptance-api
          type: pserv
          envVarKey: API_KEY
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: AUTH_COOKIE_NAME
        value: oplates_owner_acceptance_auth
      - key: OPLATES_DRAWING_ASSISTED_ENABLED
        value: "true"
      - key: OPLATES_OWNER_ACCEPTANCE_MODE
        value: "true"
      - key: DRAWING_ASSISTED_MAX_FILE_BYTES
        value: "10485760"
      - key: DRAWING_ASSISTED_MAX_PDF_PAGES
        value: "5"
      - key: DRAWING_ASSISTED_MAX_IMAGE_DIMENSION_PX
        value: "12000"
      - key: DRAWING_ASSISTED_MAX_TOTAL_PIXELS
        value: "35000000"
      - key: DRAWING_ASSISTED_CLASSIFICATION_DPI
        value: "150"
      - key: DRAWING_ASSISTED_PROCESSING_TIMEOUT_SECONDS
        value: "60"

  - type: pserv
    name: oplates-owner-acceptance-api
    runtime: docker
    branch: work/drawing-intake-phase1h-owner-acceptance
    region: ohio
    plan: 0.5c-512mb
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: >-
      /bin/sh -c 'exec uvicorn api_app:app --host 0.0.0.0
      --port ${PORT:-10000}'
    numInstances: 1
    envVars:
      - key: APP_ENV
        value: preview
      - key: APP_BASE_URL
        value: https://oplates-owner-acceptance-ui.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWT_AUD
        value: authenticated
      - key: OPLATES_DRAWING_ASSISTED_ENABLED
        value: "true"
      - key: OPLATES_DRAWING_ASSISTED_ALLOWED_USER_IDS
        sync: false
