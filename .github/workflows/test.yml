name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - "work/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-frozen-plate.txt
      - name: Install local OCR dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Verify local OCR dependency
        run: |
          tesseract --version
          tesseract --list-langs | grep -Fx eng
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q .
